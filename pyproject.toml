[project]
name = "oper-stuttgart-monitor"
version = "0.1.0"
description = "Requests-only Eventim seat availability monitor with Discord alerts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["eventim", "monitoring", "tickets", "discord", "seatmap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "PyYAML>=6.0.2,<7",
    "requests>=2.32.3,<3",
]

[project.scripts]
oper-monitor = "oper_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/Flurin17/oper_stuttgart_monitor"
Repository = "https://github.com/Flurin17/oper_stuttgart_monitor"
Issues = "https://github.com/Flurin17/oper_stuttgart_monitor/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<10",
    "responses>=0.25.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oper_monitor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
